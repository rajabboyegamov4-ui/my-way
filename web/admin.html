  function validate(){
    if(isNew&&!/^[a-z0-9-]{2,30}$/.test(idIn.value.trim())) return "ID faqat kichik lotin harf, raqam va - dan iborat bo'lsin (masalan a1-23).";
    if(isNew&&LS.list.some(function(x){return x.id===idIn.value.trim();})) return "Bu ID band.";
    if(!tIn.value.trim()) return "Sarlavhani kiriting.";
    for(var i=0;i<exs.length;i++){var e=exs[i],n="Mashq "+(i+1)+": ",d=e.data,a=e.answer;
      if(e.type==="choose"||e.type==="fill"||e.type==="listen"){
        if(e.type==="listen"?!d.say:!d.q) return n+"savol matni bo'sh.";
        if(!d.opts||d.opts.length<2) return n+"kamida 2 ta variant kerak.";
        if(d.opts.indexOf(a.a)===-1) return n+"to'g'ri javob variantlar ichida bo'lishi kerak.";
      } else if(e.type==="spell"){ if(!a.word||!/^[A-Za-z'-]+$/.test(a.word)) return n+"inglizcha so'z bitta so'z bo'lsin (bo'sh joysiz)."; if(!d.uz) return n+"tarjima bo'sh.";}

      else if(e.type==="match"){ if(!a.pairs||a.pairs.length<2||a.pairs.length>5) return n+"2 tadan 5 tagacha juftlik kerak.";}
    }
    return null;
  }
  async function save(){

          return {exercise_id:byOrd[k],answer:a,why:(e.type==="fill"&&e.why)?e.why:null};});

    var r=await SB.from("content_lessons").delete().eq("id",L.id); if(r.error){alert(sbErr(r.error));return;}
    LS.sel=null; renderLessons();
  }
  drawSecs(); drawEx();
  add(box,[h("h2",null,isNew?"Yangi dars":"Tahrirlash: "+L.title),
    h("div",{class:"row3"},field("Sarlavha",tIn),field("Qisqa tavsif",sIn),field("ID",idIn,isNew?"Keyin o'zgartirib bo'lmaydi":null)),
    h("div",{style:"display:flex;gap:20px;flex-wrap:wrap"},h("label",{class:"chk"},rvIn,"Takrorlash darsi (mashqlar boshqa darslardan olinadi)"),h("label",{class:"chk"},pbIn,"Nashr qilingan (o'quvchilarga ko'rinadi)")),
    h("h3",{style:"margin-top:20px"},"📖 Tushuntirish"),secBox,
    h("button",{class:"btn ghost small",onclick:function(){L.theory.push({h:"",p:[]});drawSecs();}},"+ Bo'lim qo'shish"),
    field("🧠 Eslab qoling (har qatorda bitta xulosa)",sumIn),
    h("h3",{style:"margin-top:20px"},"🧩 Mashqlar ("+exs.length+")"),exBox,
    h("div",{class:"mini",style:"gap:6px;flex-wrap:wrap"},Object.keys(TYPES).map(function(k){return h("button",{class:"btn ghost small",style:"width:auto;height:auto",onclick:function(){exs.push({type:k,data:{},answer:{},why:""});drawEx();}},"+ "+TYPES[k]);})),
    h("div",{class:"bar"},h("button",{class:"btn",onclick:save},"💾 Saqlash"),h("button",{class:"btn danger",onclick:del},isNew?"Bekor qilish":"🗑 Darsni o'chirish"),msg)]);
  return box;
}
